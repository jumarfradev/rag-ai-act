name: Seguridad

# Busca secretos (claves de API, tokens...) en todo el historial del repositorio.
# Es la segunda barrera, por si un commit se hace sin pre-commit instalado.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  secretos:
    name: Detección de secretos
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks

      - name: Analizar el historial
        run: |
          "$RUNNER_TEMP/gitleaks" git . --redact --verbose
