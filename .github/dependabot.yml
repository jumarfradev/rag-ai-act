# Dependabot: avisa y propone actualizaciones cuando hay versiones nuevas
# o vulnerabilidades en las dependencias.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Activar cuando exista requirements.txt o pyproject.toml:
